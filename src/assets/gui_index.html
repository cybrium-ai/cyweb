<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Cybrium — cyweb findings</title>
<style>
  /* ── Cybrium dark theme (matches platform tokens) ─────────────────────── */
  :root {
    --bg:        #0a0a13;
    --surface:   #14141f;
    --surface-2: #1c1c2a;
    --border:    #2a2a3a;
    --text:      #e4e4ea;
    --muted:     #8a8a98;
    --primary:   #9747ff;
    --primary-2: #b074ff;
    --accent:    #06b6d4;

    --sev-critical: #dc2626;
    --sev-high:     #f97316;
    --sev-medium:   #facc15;
    --sev-low:      #3b82f6;
    --sev-info:     #94a3b8;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    font-size: 14px; line-height: 1.5;
    min-height: 100vh;
  }
  a { color: var(--primary-2); text-decoration: none; }
  a:hover { text-decoration: underline; }
  code { font-family: ui-monospace, monospace; font-size: 12px; }

  /* ── Header bar ────────────────────────────────────────────────────────── */
  header {
    display: flex; align-items: center; gap: 16px;
    padding: 14px 28px;
    background: linear-gradient(180deg, #14141f 0%, #0d0d18 100%);
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 10;
  }
  header img { height: 32px; width: 32px; }
  header .title { font-weight: 600; font-size: 16px; }
  header .target {
    margin-left: 24px; color: var(--muted); font-family: ui-monospace, monospace;
    font-size: 13px;
  }
  header .meta { margin-left: auto; color: var(--muted); font-size: 12px; }

  .export-group { display: flex; gap: 8px; margin-left: 16px; }
  button {
    background: var(--surface-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 6px 12px; cursor: pointer; font-size: 13px;
    transition: all 120ms;
  }
  button:hover { border-color: var(--primary); color: var(--primary-2); }

  /* ── Layout ────────────────────────────────────────────────────────────── */
  main { padding: 24px 28px; max-width: 1600px; margin: 0 auto; }

  /* ── Severity tile row ─────────────────────────────────────────────────── */
  .tiles { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 18px; }
  .tile {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 14px 16px;
    display: flex; flex-direction: column; gap: 4px;
    position: relative; overflow: hidden;
    cursor: pointer;
  }
  .tile::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
    background: var(--accent);
  }
  .tile.critical::before { background: var(--sev-critical); }
  .tile.high::before     { background: var(--sev-high); }
  .tile.medium::before   { background: var(--sev-medium); }
  .tile.low::before      { background: var(--sev-low); }
  .tile.info::before     { background: var(--sev-info); }
  .tile .label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; }
  .tile .count { font-size: 24px; font-weight: 700; }

  /* ── Tab strip ─────────────────────────────────────────────────────────── */
  .tabs {
    display: flex; gap: 4px; margin-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }
  .tab {
    background: transparent; border: none; border-bottom: 2px solid transparent;
    padding: 10px 18px; cursor: pointer; color: var(--muted);
    font-size: 14px; font-weight: 500;
    transition: all 120ms;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--primary-2); border-bottom-color: var(--primary); }
  .tab .badge {
    display: inline-block; margin-left: 6px;
    background: var(--surface-2); color: var(--muted);
    border-radius: 99px; padding: 1px 7px;
    font-size: 11px; font-weight: 600;
  }
  .tab.active .badge { background: var(--primary); color: white; }

  .panel { display: none; }
  .panel.active { display: block; }

  /* ── Sub-tab strip (used inside Spider panel) ─────────────────────── */
  .subtabs {
    display: flex; gap: 2px; margin-bottom: 12px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 4px; width: fit-content;
  }
  .subtab {
    background: transparent; border: none; border-radius: 6px;
    padding: 6px 14px; cursor: pointer; color: var(--muted);
    font-size: 13px; font-weight: 500;
  }
  .subtab:hover { color: var(--text); }
  .subtab.active { background: var(--surface-2); color: var(--primary-2); }
  .subtab .badge {
    margin-left: 6px; background: var(--surface);
    border-radius: 99px; padding: 1px 6px; font-size: 10px; font-weight: 600;
  }
  .subpanel { display: none; }
  .subpanel.active { display: block; }

  .tag-chip {
    display: inline-block; padding: 1px 7px; border-radius: 4px;
    font-size: 10px; font-weight: 600; margin-right: 4px;
    background: var(--surface-2); border: 1px solid var(--border);
    color: var(--muted);
  }
  .tag-chip.Password { color: var(--sev-high);  border-color: var(--sev-high); }
  .tag-chip.Form     { color: var(--accent);    border-color: var(--accent); }
  .tag-chip.Script   { color: #facc15;          border-color: #facc15; }
  .tag-chip.Upload   { color: var(--sev-medium); border-color: var(--sev-medium); }
  .tag-chip.JSON     { color: #a78bfa;          border-color: #a78bfa; }
  .tag-chip.Comment  { color: var(--muted); }
  .tag-chip.MailTo   { color: var(--muted); }

  /* ── Filter bar ────────────────────────────────────────────────────────── */
  .filters {
    display: flex; gap: 12px; align-items: center; margin-bottom: 14px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 14px; flex-wrap: wrap;
  }
  .filters input, .filters select {
    background: var(--surface-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 6px 10px; font-size: 13px; outline: none;
  }
  .filters input { flex: 1; min-width: 200px; }
  .filters input:focus, .filters select:focus { border-color: var(--primary); }
  .count-pill { color: var(--muted); font-size: 12px; }

  /* ── Tables ────────────────────────────────────────────────────────────── */
  .table-wrap {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; overflow: hidden;
  }
  table { width: 100%; border-collapse: collapse; }
  th {
    background: var(--surface-2); color: var(--muted);
    text-align: left; font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.05em;
    padding: 10px 14px; border-bottom: 1px solid var(--border);
    cursor: pointer; user-select: none; white-space: nowrap;
  }
  th:hover { color: var(--primary-2); }
  td {
    padding: 10px 14px; border-bottom: 1px solid var(--border);
    vertical-align: top; font-size: 13px;
  }
  tr:hover td { background: rgba(151, 71, 255, 0.04); cursor: pointer; }

  .url-cell { font-family: ui-monospace, monospace; font-size: 12px; color: var(--muted); max-width: 380px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cwe-cell { font-family: ui-monospace, monospace; font-size: 12px; color: var(--accent); }

  /* Severity pill */
  .sev {
    display: inline-block; padding: 2px 9px; border-radius: 999px;
    font-size: 10px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.05em; min-width: 64px; text-align: center;
  }
  .sev.critical { background: color-mix(in srgb, var(--sev-critical) 18%, transparent); color: var(--sev-critical); border: 1px solid color-mix(in srgb, var(--sev-critical) 40%, transparent); }
  .sev.high     { background: color-mix(in srgb, var(--sev-high)     18%, transparent); color: var(--sev-high);     border: 1px solid color-mix(in srgb, var(--sev-high)     40%, transparent); }
  .sev.medium   { background: color-mix(in srgb, var(--sev-medium)   18%, transparent); color: var(--sev-medium);   border: 1px solid color-mix(in srgb, var(--sev-medium)   40%, transparent); }
  .sev.low      { background: color-mix(in srgb, var(--sev-low)      18%, transparent); color: var(--sev-low);      border: 1px solid color-mix(in srgb, var(--sev-low)      40%, transparent); }
  .sev.info     { background: color-mix(in srgb, var(--sev-info)     18%, transparent); color: var(--sev-info);     border: 1px solid color-mix(in srgb, var(--sev-info)     40%, transparent); }

  .scope {
    display: inline-block; padding: 1px 8px; border-radius: 99px;
    font-size: 10px; font-weight: 600;
  }
  .scope.in     { background: color-mix(in srgb, #16a34a 16%, transparent); color: #4ade80; }
  .scope.out    { background: color-mix(in srgb, #f97316 16%, transparent); color: #fb923c; }

  .method {
    display: inline-block; min-width: 56px; text-align: center;
    padding: 1px 8px; border-radius: 4px;
    font-family: ui-monospace, monospace; font-size: 11px; font-weight: 700;
    background: var(--surface-2); border: 1px solid var(--border);
  }
  .method.POST   { color: #f59e0b; border-color: #f59e0b; }
  .method.PUT    { color: #06b6d4; border-color: #06b6d4; }
  .method.DELETE { color: #dc2626; border-color: #dc2626; }
  .method.PATCH  { color: #8b5cf6; border-color: #8b5cf6; }

  .status-cell { font-family: ui-monospace, monospace; font-size: 12px; }
  .status-2xx { color: #22c55e; }
  .status-3xx { color: #06b6d4; }
  .status-4xx { color: #f97316; }
  .status-5xx { color: #dc2626; }

  /* ── Alerts tree (Phase F) ─────────────────────────────────────────────── */
  .alert-group {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; margin-bottom: 8px;
    overflow: hidden;
  }
  .alert-group-header {
    display: flex; align-items: center; gap: 10px;
    padding: 11px 14px; cursor: pointer;
    background: var(--surface-2);
  }
  .alert-group-header:hover { background: rgba(151, 71, 255, 0.07); }
  .alert-group .triangle {
    display: inline-block; width: 10px; transition: transform 120ms;
    color: var(--muted);
  }
  .alert-group.open .triangle { transform: rotate(90deg); }
  .alert-group-title { font-weight: 500; flex: 1; }
  .alert-count {
    color: var(--muted); font-size: 12px;
    background: var(--surface); border-radius: 99px; padding: 1px 8px;
  }
  .alert-instances { display: none; padding: 0; }
  .alert-group.open .alert-instances { display: block; }
  .alert-instance {
    padding: 10px 14px 10px 32px;
    border-top: 1px solid var(--border);
    cursor: pointer;
  }
  .alert-instance:hover { background: rgba(151, 71, 255, 0.04); }
  .alert-instance .url-cell { display: block; }
  .alert-detail {
    display: none;
    padding: 16px 24px;
    background: #0e0e18;
    border-top: 1px solid var(--primary);
  }
  .alert-instance.expanded + .alert-detail { display: block; }
  .alert-detail dl {
    display: grid; grid-template-columns: 120px 1fr; gap: 8px 18px;
    font-size: 13px; margin: 0;
  }
  .alert-detail dt { color: var(--muted); font-weight: 500; }
  .alert-detail dd { margin: 0; word-break: break-word; }
  .alert-detail pre {
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 6px; padding: 10px 12px; margin: 0;
    font-size: 12px; overflow-x: auto;
    white-space: pre-wrap; word-break: break-all;
  }

  .empty {
    text-align: center; padding: 48px 16px; color: var(--muted);
  }

  footer {
    text-align: center; padding: 24px; color: var(--muted); font-size: 12px;
  }
  footer a { color: var(--primary-2); }
</style>
</head>
<body>

<header>
  <img src="/logo.svg" alt="Cybrium"/>
  <span class="title">cyweb</span>
  <span class="target" id="target-host">—</span>
  <span class="meta" id="scan-meta"></span>
  <div class="export-group">
    <button onclick="window.location='/api/export.json'">JSON</button>
    <button onclick="window.location='/api/export.csv'">CSV</button>
    <button onclick="window.location='/api/export.markdown'">Markdown</button>
  </div>
</header>

<main>

  <div class="tiles" id="tiles"></div>

  <div class="tabs">
    <button class="tab active"  data-panel="alerts">Alerts <span class="badge" id="b-alerts">0</span></button>
    <button class="tab"          data-panel="spider">Spider <span class="badge" id="b-spider">0</span></button>
    <button class="tab"          data-panel="active">Active Scan <span class="badge" id="b-active">0</span></button>
  </div>

  <!-- ─── Alerts panel (Phase F — tree grouped) ───────────────────────── -->
  <div class="panel active" id="p-alerts">
    <div class="filters">
      <input id="alert-search" type="search" placeholder="Search title, URL, CWE, evidence…" autofocus>
      <select id="alert-sev">
        <option value="">All severities</option>
        <option value="critical">Critical</option>
        <option value="high">High</option>
        <option value="medium">Medium</option>
        <option value="low">Low</option>
        <option value="info">Info</option>
      </select>
      <span class="count-pill" id="alert-count"></span>
    </div>
    <div id="alert-groups"></div>
  </div>

  <!-- ─── Spider panel (Phase E + H — three sub-tabs) ──────────────────── -->
  <div class="panel" id="p-spider">
    <div class="subtabs">
      <button class="subtab active" data-sub="urls">URLs <span class="badge" id="b-sub-urls">0</span></button>
      <button class="subtab" data-sub="nodes">Added Nodes <span class="badge" id="b-sub-nodes">0</span></button>
      <button class="subtab" data-sub="messages">Messages <span class="badge" id="b-sub-msgs">0</span></button>
    </div>

    <!-- URLs sub-tab — every URL the spider observed (incl. out-of-scope) -->
    <div class="subpanel active" id="sp-urls">
      <div class="filters">
        <input id="spider-search" type="search" placeholder="Search URL…">
        <select id="spider-scope">
          <option value="">All scope</option>
          <option value="in">In scope</option>
          <option value="out">Out of scope</option>
        </select>
        <select id="spider-method">
          <option value="">All methods</option>
          <option value="GET">GET</option><option value="POST">POST</option>
          <option value="PUT">PUT</option><option value="PATCH">PATCH</option>
          <option value="DELETE">DELETE</option>
        </select>
        <select id="spider-source">
          <option value="">All sources</option>
          <option value="target">Target</option>
          <option value="robots">robots.txt</option>
          <option value="sitemap">sitemap.xml</option>
          <option value="link">Link</option>
          <option value="form">Form</option>
        </select>
        <span class="count-pill" id="spider-count"></span>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th data-sort="processed">●</th>
              <th data-sort="method">Method</th>
              <th data-sort="url">URI</th>
              <th data-sort="status_code">Code</th>
              <th data-sort="seed_source">Source</th>
              <th data-sort="in_scope">Flags</th>
            </tr>
          </thead>
          <tbody id="spider-rows"></tbody>
        </table>
      </div>
    </div>

    <!-- Added Nodes sub-tab — only in-scope, processed, distinct (URL+method) -->
    <div class="subpanel" id="sp-nodes">
      <div class="filters">
        <input id="nodes-search" type="search" placeholder="Search URL…">
        <span class="count-pill" id="nodes-count"></span>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>●</th>
              <th>Method</th>
              <th>URI</th>
            </tr>
          </thead>
          <tbody id="nodes-rows"></tbody>
        </table>
      </div>
    </div>

    <!-- Messages sub-tab — every spider HTTP request with full transaction detail -->
    <div class="subpanel" id="sp-messages">
      <div class="filters">
        <input id="msg-search" type="search" placeholder="Search URL or tag…">
        <select id="msg-status">
          <option value="">All statuses</option>
          <option value="2">2xx</option><option value="3">3xx</option>
          <option value="4">4xx</option><option value="5">5xx</option>
        </select>
        <select id="msg-tag">
          <option value="">All tags</option>
          <option value="Script">Script</option>
          <option value="Form">Form</option>
          <option value="Password">Password</option>
          <option value="Comment">Comment</option>
          <option value="JSON">JSON</option>
          <option value="MailTo">MailTo</option>
          <option value="Upload">Upload</option>
        </select>
        <span class="count-pill" id="msg-count"></span>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>●</th>
              <th>Req. Time</th>
              <th>Method</th>
              <th>URL</th>
              <th>Code</th>
              <th>Reason</th>
              <th>RTT</th>
              <th>Hdr Size</th>
              <th>Body Size</th>
              <th>Highest Alert</th>
              <th>Tags</th>
            </tr>
          </thead>
          <tbody id="msg-rows"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- ─── Active Scan panel (Phase G — Sent Messages) ────────────────── -->
  <div class="panel" id="p-active">
    <div class="filters">
      <input id="active-search" type="search" placeholder="Search URL or source…">
      <select id="active-method">
        <option value="">All methods</option>
        <option value="GET">GET</option>
        <option value="POST">POST</option>
        <option value="PUT">PUT</option>
        <option value="PATCH">PATCH</option>
        <option value="DELETE">DELETE</option>
      </select>
      <select id="active-status">
        <option value="">All statuses</option>
        <option value="2">2xx</option>
        <option value="3">3xx</option>
        <option value="4">4xx</option>
        <option value="5">5xx</option>
      </select>
      <span class="count-pill" id="active-count"></span>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th data-sort="id">ID</th>
            <th data-sort="sent_at">Sent</th>
            <th data-sort="method">Method</th>
            <th data-sort="url">URL</th>
            <th data-sort="status">Code</th>
            <th data-sort="reason">Reason</th>
            <th data-sort="rtt_ms">RTT</th>
            <th data-sort="resp_size">Size</th>
            <th data-sort="source">Source</th>
          </tr>
        </thead>
        <tbody id="active-rows"></tbody>
      </table>
    </div>
  </div>

</main>

<footer>
  Cybrium AI · cyweb scanner · <a href="https://github.com/cybrium-ai/cyweb">github.com/cybrium-ai/cyweb</a>
</footer>

<script>
  const SEV_ORDER = { critical: 0, high: 1, medium: 2, low: 3, info: 4 };
  let DATA = null;
  let ACTIVE_TAB = 'alerts';
  let SORT = { spider: { key: 'method', dir: 1 }, active: { key: 'id', dir: 1 } };
  let EXPANDED_GROUPS = new Set();
  let EXPANDED_INSTANCES = new Set();

  function sevName(s) {
    if (typeof s === 'string') return s.toLowerCase();
    if (s && typeof s === 'object') return Object.keys(s)[0]?.toLowerCase() || 'info';
    return 'info';
  }
  function escape(s) {
    return String(s ?? '').replace(/[&<>"']/g, ch => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[ch]));
  }

  async function load() {
    const res = await fetch('/api/result');
    DATA = await res.json();
    DATA.spider_nodes = DATA.spider_nodes || [];
    DATA.http_events  = DATA.http_events  || [];

    document.getElementById('target-host').textContent = DATA.target;
    const dur = (DATA.duration_ms / 1000).toFixed(1);
    document.getElementById('scan-meta').textContent =
      `${DATA.findings.length} alerts · ${DATA.spider_nodes.length} spider nodes · ` +
      `${DATA.http_events.length} active-scan req · ${dur}s`;

    document.getElementById('b-alerts').textContent = DATA.findings.length;
    document.getElementById('b-spider').textContent = DATA.spider_nodes.length;
    document.getElementById('b-active').textContent = DATA.http_events.length;

    // Spider sub-tab badges (Phase H)
    document.getElementById('b-sub-urls').textContent  = DATA.spider_nodes.length;
    const addedNodes = DATA.spider_nodes.filter(n => n.in_scope && n.processed);
    document.getElementById('b-sub-nodes').textContent = addedNodes.length;
    document.getElementById('b-sub-msgs').textContent  = addedNodes.length;

    renderTiles();
    renderAlerts();
    renderSpider();
    renderNodes();
    renderMessages();
    renderActive();
  }

  function renderTiles() {
    const s = DATA.summary;
    const html = ['critical','high','medium','low','info'].map(k => `
      <div class="tile ${k}" data-sev="${k}">
        <span class="label">${k}</span>
        <span class="count">${s[k]}</span>
      </div>
    `).join('');
    document.getElementById('tiles').innerHTML = html;
    document.querySelectorAll('.tile').forEach(el => {
      el.onclick = () => {
        switchTab('alerts');
        document.getElementById('alert-sev').value = el.dataset.sev;
        renderAlerts();
      };
    });
  }

  /* ── Alerts (Phase F — tree-grouped) ────────────────────────────────── */
  function filteredAlerts() {
    const q = document.getElementById('alert-search').value.toLowerCase();
    const sev = document.getElementById('alert-sev').value;
    return DATA.findings.filter(f => {
      const fsev = sevName(f.severity);
      if (sev && fsev !== sev) return false;
      if (q) {
        const hay = `${f.title} ${f.url} ${f.cwe ?? ''} ${f.evidence ?? ''} ${f.description}`.toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });
  }

  function renderAlerts() {
    const items = filteredAlerts();
    document.getElementById('alert-count').textContent =
      `${items.length} of ${DATA.findings.length} alerts`;

    // Group by title
    const groups = new Map();
    for (const f of items) {
      if (!groups.has(f.title)) groups.set(f.title, []);
      groups.get(f.title).push(f);
    }
    // Sort groups by max severity then title
    const ordered = [...groups.entries()].sort((a, b) => {
      const av = Math.min(...a[1].map(f => SEV_ORDER[sevName(f.severity)] ?? 9));
      const bv = Math.min(...b[1].map(f => SEV_ORDER[sevName(f.severity)] ?? 9));
      if (av !== bv) return av - bv;
      return a[0].localeCompare(b[0]);
    });

    const wrap = document.getElementById('alert-groups');
    if (ordered.length === 0) {
      wrap.innerHTML = `<div class="empty">No alerts match the current filters.</div>`;
      return;
    }
    wrap.innerHTML = ordered.map(([title, instances]) => {
      const sev = sevName(instances[0].severity);
      const isOpen = EXPANDED_GROUPS.has(title);
      const cnt = instances.length;
      return `
        <div class="alert-group ${isOpen ? 'open' : ''}" data-group="${escape(title)}">
          <div class="alert-group-header">
            <span class="triangle">▶</span>
            <span class="sev ${sev}">${sev}</span>
            <span class="alert-group-title">${escape(title)}</span>
            <span class="alert-count">${cnt}</span>
          </div>
          <div class="alert-instances">
            ${instances.map((f, i) => {
              const ikey = title + '|' + i;
              const expanded = EXPANDED_INSTANCES.has(ikey);
              return `
                <div class="alert-instance ${expanded ? 'expanded' : ''}" data-ikey="${escape(ikey)}">
                  <span class="method ${escape(f.http_method || 'GET')}">${escape(f.http_method || 'GET')}</span>
                  <span class="url-cell" title="${escape(f.url)}">${escape(f.url)}</span>
                </div>
                <div class="alert-detail" data-detail="${escape(ikey)}" style="${expanded ? '' : 'display:none'}">
                  <dl>
                    <dt>URL</dt><dd><code>${escape(f.url)}</code></dd>
                    ${f.cwe ? `<dt>CWE</dt><dd><code>${escape(f.cwe)}</code></dd>` : ''}
                    <dt>Category</dt><dd>${escape(f.category)}</dd>
                    ${f.confidence != null ? `<dt>Confidence</dt><dd>${escape(f.confidence)}</dd>` : ''}
                    <dt>Description</dt><dd>${escape(f.description)}</dd>
                    ${f.evidence ? `<dt>Evidence</dt><dd><pre>${escape(f.evidence)}</pre></dd>` : ''}
                    ${f.remediation ? `<dt>Solution</dt><dd>${escape(f.remediation)}</dd>` : ''}
                    <dt>Rule ID</dt><dd><code>${escape(f.id)}</code></dd>
                    ${f.vuln_class ? `<dt>Vuln class</dt><dd><code>${escape(f.vuln_class)}</code></dd>` : ''}
                  </dl>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }).join('');

    // Wire group toggle
    wrap.querySelectorAll('.alert-group-header').forEach(el => {
      el.onclick = () => {
        const g = el.parentElement.dataset.group;
        if (EXPANDED_GROUPS.has(g)) EXPANDED_GROUPS.delete(g);
        else EXPANDED_GROUPS.add(g);
        renderAlerts();
      };
    });
    // Wire instance toggle
    wrap.querySelectorAll('.alert-instance').forEach(el => {
      el.onclick = (e) => {
        e.stopPropagation();
        const k = el.dataset.ikey;
        if (EXPANDED_INSTANCES.has(k)) EXPANDED_INSTANCES.delete(k);
        else EXPANDED_INSTANCES.add(k);
        renderAlerts();
      };
    });
  }

  /* ── Spider (Phase E) ───────────────────────────────────────────────── */
  function renderSpider() {
    const q   = document.getElementById('spider-search').value.toLowerCase();
    const sc  = document.getElementById('spider-scope').value;
    const m   = document.getElementById('spider-method').value;
    const src = document.getElementById('spider-source').value;
    let nodes = DATA.spider_nodes.filter(n => {
      if (sc === 'in'  && !n.in_scope) return false;
      if (sc === 'out' &&  n.in_scope) return false;
      if (m && n.method !== m)         return false;
      if (src && n.seed_source !== src) return false;
      if (q && !n.url.toLowerCase().includes(q)) return false;
      return true;
    });
    // Sort
    const { key, dir } = SORT.spider;
    nodes = nodes.slice().sort((a, b) => {
      const av = a[key] ?? '', bv = b[key] ?? '';
      if (av < bv) return -1 * dir;
      if (av > bv) return  1 * dir;
      return 0;
    });
    document.getElementById('spider-count').textContent =
      `${nodes.length} of ${DATA.spider_nodes.length} nodes`;
    const tbody = document.getElementById('spider-rows');
    if (nodes.length === 0) {
      tbody.innerHTML = `<tr><td colspan="6" class="empty">No spider nodes match.</td></tr>`;
      return;
    }
    tbody.innerHTML = nodes.map(n => {
      const dot = n.processed ? '🟢' : (n.in_scope ? '⚪' : '🔴');
      const status = n.status_code ? `<span class="status-cell status-${Math.floor(n.status_code/100)}xx">${n.status_code}</span>` : '<span class="status-cell" style="color:var(--muted)">—</span>';
      const flag = n.in_scope ? '<span class="scope in">In scope</span>' : '<span class="scope out">Out of scope</span>';
      return `
        <tr>
          <td>${dot}</td>
          <td><span class="method ${escape(n.method)}">${escape(n.method)}</span></td>
          <td class="url-cell" title="${escape(n.url)}">${escape(n.url)}</td>
          <td>${status}</td>
          <td><span style="color:var(--muted);font-size:12px">${escape(n.seed_source)}</span></td>
          <td>${flag}</td>
        </tr>
      `;
    }).join('');
  }

  /* ── Spider sub-tabs (Phase H) ────────────────────────────────────── */
  function renderNodes() {
    const q = document.getElementById('nodes-search').value.toLowerCase();
    const items = DATA.spider_nodes
      .filter(n => n.in_scope && n.processed)
      .filter(n => !q || n.url.toLowerCase().includes(q));
    document.getElementById('nodes-count').textContent =
      `${items.length} added nodes`;
    const tbody = document.getElementById('nodes-rows');
    if (items.length === 0) {
      tbody.innerHTML = `<tr><td colspan="3" class="empty">No nodes — run the spider with <code>--spider</code>.</td></tr>`;
      return;
    }
    tbody.innerHTML = items.map(n => `
      <tr>
        <td>🟢</td>
        <td><span class="method ${escape(n.method)}">${escape(n.method)}</span></td>
        <td class="url-cell" title="${escape(n.url)}">${escape(n.url)}</td>
      </tr>
    `).join('');
  }

  function renderMessages() {
    const q       = document.getElementById('msg-search').value.toLowerCase();
    const sFilter = document.getElementById('msg-status').value;
    const tFilter = document.getElementById('msg-tag').value;
    const items = DATA.spider_nodes
      .filter(n => n.processed && (n.status_code != null))
      .filter(n => !sFilter || (n.status_code && Math.floor(n.status_code/100) === Number(sFilter)))
      .filter(n => !tFilter || (n.tags || []).includes(tFilter))
      .filter(n => {
        if (!q) return true;
        const hay = (n.url + ' ' + (n.tags || []).join(' ')).toLowerCase();
        return hay.includes(q);
      });
    document.getElementById('msg-count').textContent =
      `${items.length} of ${DATA.spider_nodes.filter(n=>n.processed).length} messages`;
    const tbody = document.getElementById('msg-rows');
    if (items.length === 0) {
      tbody.innerHTML = `<tr><td colspan="11" class="empty">No spider messages — run with <code>--spider</code>.</td></tr>`;
      return;
    }
    tbody.innerHTML = items.map(n => {
      const ts = n.req_timestamp ? n.req_timestamp.split('T')[1]?.split('.')[0] : '—';
      const code = n.status_code != null
        ? `<span class="status-cell status-${Math.floor(n.status_code/100)}xx">${n.status_code}</span>`
        : '—';
      const alert = n.highest_alert
        ? `<span class="sev ${escape(n.highest_alert)}">${escape(n.highest_alert)}</span>`
        : '<span style="color:var(--muted)">—</span>';
      const tags = (n.tags || []).map(t => `<span class="tag-chip ${escape(t)}">${escape(t)}</span>`).join('');
      return `
        <tr>
          <td>🟢</td>
          <td><code style="color:var(--muted);font-size:11px">${escape(ts)}</code></td>
          <td><span class="method ${escape(n.method)}">${escape(n.method)}</span></td>
          <td class="url-cell" title="${escape(n.url)}">${escape(n.url)}</td>
          <td>${code}</td>
          <td style="color:var(--muted);font-size:12px">${escape(n.reason || '')}</td>
          <td><code>${n.rtt_ms}ms</code></td>
          <td><code>${formatBytes(n.resp_header_size)}</code></td>
          <td><code>${formatBytes(n.resp_body_size)}</code></td>
          <td>${alert}</td>
          <td>${tags || '<span style="color:var(--muted)">—</span>'}</td>
        </tr>
      `;
    }).join('');
  }

  /* ── Active Scan (Phase G — Sent Messages) ──────────────────────────── */
  function renderActive() {
    const q = document.getElementById('active-search').value.toLowerCase();
    const m = document.getElementById('active-method').value;
    const sFilter = document.getElementById('active-status').value;
    let evts = DATA.http_events.filter(e => {
      if (m && e.method !== m) return false;
      if (sFilter && Math.floor(e.status / 100) !== Number(sFilter)) return false;
      if (q) {
        const hay = `${e.url} ${e.source}`.toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });
    const { key, dir } = SORT.active;
    evts = evts.slice().sort((a, b) => {
      const av = a[key] ?? '', bv = b[key] ?? '';
      if (av < bv) return -1 * dir;
      if (av > bv) return  1 * dir;
      return 0;
    });
    document.getElementById('active-count').textContent =
      `${evts.length} of ${DATA.http_events.length} requests`;
    const tbody = document.getElementById('active-rows');
    if (evts.length === 0) {
      tbody.innerHTML = `<tr><td colspan="9" class="empty">No active-scan requests recorded. Run cyweb with --fuzz to populate.</td></tr>`;
      return;
    }
    tbody.innerHTML = evts.map(e => {
      const ts = e.sent_at.split('T')[1]?.split('.')[0] ?? e.sent_at;
      const cls = `status-${Math.floor(e.status/100)}xx`;
      return `
        <tr>
          <td><code>${e.id}</code></td>
          <td><code style="color:var(--muted)">${escape(ts)}</code></td>
          <td><span class="method ${escape(e.method)}">${escape(e.method)}</span></td>
          <td class="url-cell" title="${escape(e.url)}">${escape(e.url)}</td>
          <td class="status-cell ${cls}">${e.status}</td>
          <td style="color:var(--muted);font-size:12px">${escape(e.reason)}</td>
          <td><code>${e.rtt_ms}ms</code></td>
          <td><code>${formatBytes(e.resp_size)}</code></td>
          <td><code style="color:var(--accent);font-size:11px">${escape(e.source)}</code></td>
        </tr>
      `;
    }).join('');
  }

  function formatBytes(n) {
    if (n < 1024) return n + 'B';
    if (n < 1024 * 1024) return (n / 1024).toFixed(1) + 'K';
    return (n / 1024 / 1024).toFixed(1) + 'M';
  }

  /* ── Tab switching ──────────────────────────────────────────────────── */
  function switchTab(panel) {
    ACTIVE_TAB = panel;
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.panel === panel));
    document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === 'p-' + panel));
  }
  document.querySelectorAll('.tab').forEach(t => t.onclick = () => switchTab(t.dataset.panel));

  /* Spider sub-tab switching (Phase H) */
  document.querySelectorAll('.subtab').forEach(t => {
    t.onclick = () => {
      const sub = t.dataset.sub;
      document.querySelectorAll('.subtab').forEach(x => x.classList.toggle('active', x.dataset.sub === sub));
      document.querySelectorAll('.subpanel').forEach(p => p.classList.toggle('active', p.id === 'sp-' + sub));
    };
  });
  ['nodes-search'].forEach(id => document.getElementById(id).addEventListener('input', renderNodes));
  ['msg-search','msg-status','msg-tag'].forEach(id => {
    const el = document.getElementById(id);
    el.addEventListener('input', renderMessages);
    el.addEventListener('change', renderMessages);
  });

  /* ── Filter bindings ────────────────────────────────────────────────── */
  ['alert-search','alert-sev'].forEach(id => document.getElementById(id).addEventListener('input', renderAlerts));
  document.getElementById('alert-sev').addEventListener('change', renderAlerts);
  ['spider-search','spider-scope','spider-method','spider-source'].forEach(id => {
    const el = document.getElementById(id);
    el.addEventListener('input', renderSpider);
    el.addEventListener('change', renderSpider);
  });
  ['active-search','active-method','active-status'].forEach(id => {
    const el = document.getElementById(id);
    el.addEventListener('input', renderActive);
    el.addEventListener('change', renderActive);
  });

  /* ── Sort headers ───────────────────────────────────────────────────── */
  document.querySelectorAll('#p-spider th[data-sort]').forEach(th => {
    th.onclick = () => {
      const k = th.dataset.sort;
      if (SORT.spider.key === k) SORT.spider.dir = -SORT.spider.dir;
      else { SORT.spider.key = k; SORT.spider.dir = 1; }
      renderSpider();
    };
  });
  document.querySelectorAll('#p-active th[data-sort]').forEach(th => {
    th.onclick = () => {
      const k = th.dataset.sort;
      if (SORT.active.key === k) SORT.active.dir = -SORT.active.dir;
      else { SORT.active.key = k; SORT.active.dir = 1; }
      renderActive();
    };
  });

  load();
</script>
</body>
</html>
