[package]
name = "cyweb"
version = "0.8.7"
edition = "2021"
authors = ["Cybrium AI <hello@cybrium.ai>"]
description = "Fast, accurate web vulnerability scanner. Scans headers, paths, server configs, and known vulnerabilities."
license = "Apache-2.0"
repository = "https://github.com/cybrium-ai/cyweb"
keywords = ["security", "scanner", "web", "vulnerability", "pentest"]
categories = ["command-line-utilities", "web-programming"]

[[bin]]
name = "cyweb"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "cookies", "rustls-tls", "http2"], default-features = false }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
regex = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
colored = "2"
chrono = { version = "0.4", features = ["serde"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
scraper = "0.22"
futures = "0.3"
base64 = "0.22"
rand = "0.8"
dirs = "5"
hex = "0.4"
walkdir = "2"
# v0.8.2 — DSL helpers for the templates engine. Upstream community
# templates use md5/sha1/sha256/base64/url_encode in their `dsl:`
# matcher expressions; cyweb's evaluator now supports them so those
# templates convert and run cleanly.
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
urlencoding = "2"
# v0.8.5 — DNS template execution. hickory-resolver is the canonical
# pure-Rust DNS client (rebranded trust-dns). Async, A/AAAA/CNAME/
# TXT/MX/NS out of the box. tokio-runtime feature aligns with cyweb's
# existing tokio scheduler.
hickory-resolver = { version = "0.24", default-features = false, features = ["tokio-runtime", "system-config"] }
# Sprint 76 Phase 7 — WebSocket hijacking. tokio-tungstenite is the
# canonical async WS client; rustls-tls-native-roots matches reqwest's
# rustls feature so we don't drag in OpenSSL.
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
http = "1"
# v0.8 Phase D — `--gui` flag spins up a local web UI on 127.0.0.1:8990
# showing scan findings with Cybrium branding. axum 0.7 sits on hyper 1
# which is already a transitive dep via reqwest, so we don't pull in a
# parallel runtime. tower is required for axum's middleware stack.
axum = "0.7"
tower = "0.5"
# v0.8 Phase N — `--ajax-spider` flag drives a headless Chromium via
# Chrome DevTools Protocol to crawl JS-rendered SPAs. chromiumoxide
# pulls in async-tungstenite + websocket transport but no Chromium
# binary itself; the operator needs Chrome / Chromium installed
# locally (auto-discovered, or override via CYWEB_CHROME_PATH env).
chromiumoxide = { version = "0.7", features = ["tokio-runtime"], default-features = false }

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
