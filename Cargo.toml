[package]
name = "cyweb"
version = "0.7.2"
edition = "2021"
authors = ["Cybrium AI <hello@cybrium.ai>"]
description = "Fast, accurate web vulnerability scanner. Scans headers, paths, server configs, and known vulnerabilities."
license = "Apache-2.0"
repository = "https://github.com/cybrium-ai/cyweb"
keywords = ["security", "scanner", "web", "vulnerability", "pentest"]
categories = ["command-line-utilities", "web-programming"]

[[bin]]
name = "cyweb"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "cookies", "rustls-tls"], default-features = false }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
regex = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
colored = "2"
chrono = { version = "0.4", features = ["serde"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
scraper = "0.22"
futures = "0.3"
base64 = "0.22"
rand = "0.8"
dirs = "5"
hex = "0.4"
walkdir = "2"
# Sprint 76 Phase 7 — WebSocket hijacking. tokio-tungstenite is the
# canonical async WS client; rustls-tls-native-roots matches reqwest's
# rustls feature so we don't drag in OpenSSL.
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
http = "1"
# v0.8 Phase D — `--gui` flag spins up a local web UI on 127.0.0.1:8990
# showing scan findings with Cybrium branding. axum 0.7 sits on hyper 1
# which is already a transitive dep via reqwest, so we don't pull in a
# parallel runtime. tower is required for axum's middleware stack.
axum = "0.7"
tower = "0.5"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
