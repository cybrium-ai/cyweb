name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write    # GHCR push for the cyweb container image
  id-token: write    # OIDC federated token for Azure Trusted Signing (Windows)

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            name: cyweb-linux-amd64
            sign: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            name: cyweb-linux-arm64
            sign: false
          - target: x86_64-apple-darwin
            os: macos-14
            name: cyweb-darwin-amd64
            sign: true
          - target: aarch64-apple-darwin
            os: macos-14
            name: cyweb-darwin-arm64
            sign: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            name: cyweb-windows-amd64.exe
            sign: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - run: cargo build --release --target ${{ matrix.target }}

      # ── Apple code signing (macOS builds only) ─────────────────────
      - name: Import Apple signing certificate
        if: matrix.sign
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/cert.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)

          echo -n "$APPLE_CERTIFICATE_BASE64" | base64 --decode -o $CERT_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERT_PATH -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

      - name: Sign macOS binary
        if: matrix.sign
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          codesign --force --sign "$APPLE_SIGNING_IDENTITY" --timestamp --options runtime target/${{ matrix.target }}/release/cyweb
          codesign --verify --deep --strict target/${{ matrix.target }}/release/cyweb
          echo "Signed and verified: ${{ matrix.name }}"

      - name: Package binary (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/cyweb dist/${{ matrix.name }}
          chmod +x dist/${{ matrix.name }}

      - name: Package binary (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/cyweb.exe dist/${{ matrix.name }}

      # ── Azure Trusted Signing (Windows binaries only) ──────────────
      # Federated OIDC — no client_secret. Subject filter on the FIC
      # is ref:refs/tags/v* so PR jobs literally cannot mint a token.
      - name: Sign Windows binary via Azure Trusted Signing
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v')
        uses: Azure/trusted-signing-action@v0.5
        with:
          azure-tenant-id:              ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id:              ${{ secrets.AZURE_CLIENT_ID }}
          endpoint:                     https://cus.codesigning.azure.net/
          trusted-signing-account-name: cybrium-signing
          certificate-profile-name:     cybrium
          files-folder:                 dist
          files-folder-filter:          exe
          file-digest:                  SHA256
          timestamp-rfc3161:            http://timestamp.acs.microsoft.com
          timestamp-digest:             SHA256

      - name: Verify Windows signature
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature "dist/${{ matrix.name }}"
          Write-Host "Signature status: $($sig.Status)"
          Write-Host "Signer: $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { throw "Signature verification failed: $($sig.Status)" }

      - name: Notarize macOS binary
        if: matrix.sign
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ditto -c -k --keepParent dist/${{ matrix.name }} /tmp/${{ matrix.name }}.zip
          xcrun notarytool submit /tmp/${{ matrix.name }}.zip \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          echo "Notarization complete for ${{ matrix.name }}"

      # Windows artifact is already signed in place by the previous
      # step on tag pushes (no-op on PRs). All platforms upload under
      # the canonical matrix.name so downstream jobs are uniform.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate checksums
        run: |
          cd artifacts
          for dir in */; do
            (cd "$dir" && sha256sum * >> ../checksums.txt)
          done
          cat checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/cyweb-linux-amd64/cyweb-linux-amd64
            artifacts/cyweb-linux-arm64/cyweb-linux-arm64
            artifacts/cyweb-darwin-amd64/cyweb-darwin-amd64
            artifacts/cyweb-darwin-arm64/cyweb-darwin-arm64
            artifacts/cyweb-windows-amd64.exe/cyweb-windows-amd64.exe
            artifacts/checksums.txt

      # ── Auto-publish Homebrew formula to cybrium-ai/homebrew-cli ──
      - name: Resolve version
        id: ver
        run: echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Extract per-platform SHA256s
        id: sums
        run: |
          {
            echo "darwin_arm64_sha=$(awk '/cyweb-darwin-arm64$/  {print $1}' artifacts/checksums.txt)"
            echo "darwin_amd64_sha=$(awk '/cyweb-darwin-amd64$/  {print $1}' artifacts/checksums.txt)"
            echo "linux_arm64_sha=$(awk  '/cyweb-linux-arm64$/   {print $1}' artifacts/checksums.txt)"
            echo "linux_amd64_sha=$(awk  '/cyweb-linux-amd64$/   {print $1}' artifacts/checksums.txt)"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout Homebrew tap
        uses: actions/checkout@v4
        with:
          repository: cybrium-ai/homebrew-cli
          token:      ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path:       homebrew-cli

      # ── GHCR multi-arch image ──────────────────────────────────────
      # Uses the prebuilt linux binaries from the matrix `build` job so we
      # don't recompile inside Docker. The runtime image is debian-slim
      # plus ca-certificates + tini; payloads/rules are baked in at
      # /opt/cyweb so the SentinelAI cyweb_runner can invoke
      #   cyweb scan ... --payloads /opt/cyweb/payloads
      # without bind-mounting anything from the host or the K8s pod.
      - name: Stage linux binaries for docker build
        run: |
          install -m 0755 artifacts/cyweb-linux-amd64/cyweb-linux-amd64 ./cyweb-linux-amd64
          install -m 0755 artifacts/cyweb-linux-arm64/cyweb-linux-arm64 ./cyweb-linux-arm64

      # Sprint v0.8.1 — convert the upstream community template repo
      # into cyweb's format and bundle the converted set into the image.
      # Runs on every `v*` tag so a fresh release always carries fresh
      # templates. Conversion failures are tolerated (the converter
      # skips templates whose DSL features aren't supported yet) — we
      # publish whatever converts cleanly. The image build's COPY
      # directive expects `templates-converted/` to exist even when
      # empty.
      - name: Convert upstream templates → cyweb format
        run: |
          mkdir -p templates-converted
          # Best-effort clone — if the upstream repo is unreachable we
          # ship the image without templates rather than fail the build.
          if git clone --depth 1 https://github.com/projectdiscovery/nuclei-templates /tmp/upstream-templates; then
            install -m 0755 artifacts/cyweb-linux-amd64/cyweb-linux-amd64 /tmp/cyweb-converter
            /tmp/cyweb-converter convert-templates \
              --input /tmp/upstream-templates \
              --output templates-converted/ \
              || echo "convert-templates exited non-zero — using whatever converted cleanly"
            CONVERTED=$(find templates-converted -name '*.yaml' | wc -l | tr -d ' ')
            echo "Converted $CONVERTED templates from upstream community repo."
          else
            echo "Could not reach upstream templates — shipping image without bundled templates."
          fi

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push cyweb image (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          file:    Dockerfile
          push:    true
          platforms: linux/amd64,linux/arm64
          provenance: false
          tags: |
            ghcr.io/cybrium-ai/cyweb:${{ steps.ver.outputs.tag }}
            ghcr.io/cybrium-ai/cyweb:latest
          cache-from: type=gha,scope=cyweb
          cache-to:   type=gha,scope=cyweb,mode=max

      - name: Render + commit Formula/cyweb.rb
        run: |
          VERSION="${{ steps.ver.outputs.tag }}"
          BASE="https://github.com/cybrium-ai/cyweb/releases/download/v${VERSION}"
          mkdir -p homebrew-cli/Formula
          cat > homebrew-cli/Formula/cyweb.rb <<RUBY
          class Cyweb < Formula
            desc     "Cybrium Web — fast web vulnerability scanner"
            homepage "https://github.com/cybrium-ai/cyweb"
            license  "Apache-2.0"
            version  "${VERSION}"

            on_macos do
              on_arm do
                url    "${BASE}/cyweb-darwin-arm64"
                sha256 "${{ steps.sums.outputs.darwin_arm64_sha }}"
              end
              on_intel do
                url    "${BASE}/cyweb-darwin-amd64"
                sha256 "${{ steps.sums.outputs.darwin_amd64_sha }}"
              end
            end

            on_linux do
              on_arm do
                url    "${BASE}/cyweb-linux-arm64"
                sha256 "${{ steps.sums.outputs.linux_arm64_sha }}"
              end
              on_intel do
                url    "${BASE}/cyweb-linux-amd64"
                sha256 "${{ steps.sums.outputs.linux_amd64_sha }}"
              end
            end

            def install
              if OS.mac? && Hardware::CPU.arm?
                bin.install "cyweb-darwin-arm64" => "cyweb"
              elsif OS.mac? && Hardware::CPU.intel?
                bin.install "cyweb-darwin-amd64" => "cyweb"
              elsif OS.linux? && Hardware::CPU.arm?
                bin.install "cyweb-linux-arm64" => "cyweb"
              else
                bin.install "cyweb-linux-amd64" => "cyweb"
              end
            end

            test do
              assert_match "cyweb", shell_output("#{bin}/cyweb version")
            end
          end
          RUBY
          cd homebrew-cli
          git config user.name  "cybrium-bot"
          git config user.email "bot@cybrium.ai"
          git add Formula/cyweb.rb
          git commit -m "cyweb: bump to v${VERSION}" || echo "no changes"
          git push

  docker:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cyweb-linux-amd64
          path: dist
      - name: Build and push Docker image
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          chmod +x dist/cyweb-linux-amd64
          cat > Dockerfile.release <<'DOCKERFILE'
          FROM debian:bookworm-slim
          RUN apt-get update && apt-get install -y ca-certificates && rm -rf /var/lib/apt/lists/*
          COPY dist/cyweb-linux-amd64 /usr/local/bin/cyweb
          ENTRYPOINT ["cyweb"]
          DOCKERFILE
          docker build -f Dockerfile.release -t ghcr.io/cybrium-ai/cyweb:${{ github.ref_name }} -t ghcr.io/cybrium-ai/cyweb:latest .
          docker push ghcr.io/cybrium-ai/cyweb:${{ github.ref_name }}
          docker push ghcr.io/cybrium-ai/cyweb:latest
